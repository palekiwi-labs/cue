[package]
name = "cue-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["clock", "serde"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
