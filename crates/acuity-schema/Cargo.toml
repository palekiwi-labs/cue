[package]
name = "acuity-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }

[[bin]]
name = "codegen"
path = "src/bin/codegen.rs"
