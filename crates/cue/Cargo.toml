[package]
name = "cue"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
cuelib = { path = "../cuelib" }
serde = { version = "1.0.228", features = ["derive"] }
arboard = "3.6.1"
image = { version = "0.25", features = ["png", "jpeg"] }
serde_json = "1.0.149"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
