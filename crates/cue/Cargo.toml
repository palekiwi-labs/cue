[package]
name = "cue"
version = "0.2.0-spike"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
cuelib = { path = "../cuelib" }
figment = { version = "0.10", features = ["json"] }
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
arboard = "3.6.1"
image = { version = "0.25", features = ["png", "jpeg"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
